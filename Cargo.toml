[workspace]
resolver = "2"
members = [
    "crates/sw-domain",
    "crates/sw-plugin",
    "crates/sw-server",
]

# Game crates live at the workspace root sibling paths (path deps from sw-server).

default-members = ["crates/sw-server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Stacks Wars"]
repository = "https://github.com/stacks-wars/backend"

[workspace.dependencies]
sw-domain = { path = "crates/sw-domain" }
sw-plugin = { path = "crates/sw-plugin" }

anyhow = "1.0.104"
async-trait = "0.1.91"
axum = { version = "0.8.9", features = ["ws", "macros"] }
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
futures = "0.3.33"
jsonwebtoken = "9.3.1"
parking_lot = "0.12.5"
redis = { version = "1.4.1", features = ["tokio-comp", "connection-manager"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "macros", "migrate"] }
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["full"] }
tower = "0.5.3"
tower-http = { version = "0.7.0", features = ["cors", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
uuid = { version = "1.24.0", features = ["serde", "v4", "v7"] }
