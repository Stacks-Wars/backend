[package]
name = "sw-server"
version.workspace = true
edition.workspace = true
license-file = "../../LICENSE"
description = "Stacks Wars API and realtime server shell"

[[bin]]
name = "sw-server"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
chrono = { workspace = true }
dotenvy = { workspace = true }
futures = { workspace = true }
jsonwebtoken = { workspace = true }
parking_lot = { workspace = true }
redis = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
sw-domain = { workspace = true }
sw-plugin = { workspace = true }
solana-pubkey = { version = "2.4", default-features = false, features = ["std", "sha2", "curve25519"] }
sha2 = "0.10"
base64 = "0.22"
sw_checkers = { workspace = true }
sw_lexi_wars = { workspace = true }
sw_ludo = { workspace = true }
sw_ludo_rush = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
web-push = { workspace = true }

[dev-dependencies]
http-body-util = "0.1"
tower = { workspace = true, features = ["util"] }
