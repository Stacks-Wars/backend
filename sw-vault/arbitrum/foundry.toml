[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
evm_version = "paris"
ffi = false

[rpc_endpoints]
sepolia = "https://sepolia-rollup.arbitrum.io/rpc"
one = "https://arb1.arbitrum.io/rpc"

[etherscan]
sepolia = { key = "${ARBISCAN_API_KEY}", url = "https://api-sepolia.arbiscan.io/api" }
one = { key = "${ARBISCAN_API_KEY}", url = "https://api.arbiscan.io/api" }
